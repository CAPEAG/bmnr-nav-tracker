name: Update prices

on:
  schedule:
    # Every 15 min during US regular hours (13:00–21:59 UTC covers 9:30–16:00 ET in both EDT and EST), Mon–Fri
    - cron: '*/15 13-21 * * 1-5'
    # Hourly during extended hours (pre-market / after-hours)
    - cron: '0 9-12,22-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fetch quotes (BMNR, ETHA, ORBS, ETH, BTC)
        run: node scripts/fetch-prices.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "prices: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          git push
